[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caf-agent-runtime"
version = "0.1.0"
description = "Provider-neutral coding agent runtime contract for CAF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
